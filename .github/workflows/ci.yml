name: Validate
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --frozen --config supabase/functions/deno.json supabase/functions/send-organization-invitation/index.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
